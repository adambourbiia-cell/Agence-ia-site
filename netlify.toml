[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Images, CSS, JS : cache 1 semaine, revalidé ensuite
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSS/JS : toujours revalidés (les pages y ajoutent ?v=… à chaque mise à jour)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/demo/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Polices : ne changent jamais
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Ancienne adresse Netlify → domaine principal
[[redirects]]
  from = "https://ligne-studio-web.netlify.app/*"
  to = "https://vortex-agence.fr/:splat"
  status = 301
  force = true

# Code des fonctions : jamais servi comme fichier public
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
