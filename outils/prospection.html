<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prospection — Vortex</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root { --bg: #0f1117; --card: #171c27; --line: rgba(255,255,255,.1); --teal: #22c1d3; --teal-d: #1a9fb0; --muted: #9aa3b2; --ok: #3ddc84; --warn: #ffb020; --no: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    header { position: sticky; top: 0; z-index: 5; padding: 14px 16px; background: rgba(15,17,23,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 10px; font-family: Syne, sans-serif; font-size: 22px; }
    h1 em { font-style: normal; color: var(--teal); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, textarea { font: inherit; color: #fff; background: #0b0e14; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal); }
    .stats { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .stats b { color: #fff; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .card.done { opacity: .55; }
    .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .name { font-weight: 700; font-size: 17px; }
    .meta { font-size: 13px; color: var(--muted); }
    .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,.08); }
    .pill.s-envoye { background: rgba(34,193,211,.15); color: var(--teal); }
    .pill.s-relance { background: rgba(255,176,32,.15); color: var(--warn); }
    .pill.s-interesse, .pill.s-client { background: rgba(61,220,132,.15); color: var(--ok); }
    .pill.s-refus, .pill.s-stop { background: rgba(255,107,107,.15); color: var(--no); }
    textarea { width: 100%; min-height: 118px; margin: 12px 0 10px; resize: vertical; font-size: 14px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: #fff; font: inherit; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; }
    .btn.primary { background: linear-gradient(180deg, var(--teal), var(--teal-d)); border-color: transparent; }
    .btn.wa { background: #1faa55; border-color: transparent; }
    .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .btn.small { padding: 7px 10px; font-size: 13px; }
    details { margin-top: 4px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .add input, .add select { width: 100%; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    @media (max-width: 560px) { .add { grid-template-columns: 1fr; } }
  </style>
</head>

    <h1>Prospection <em>Vortex</em></h1>
    <div class="row">

        <optgroup label="Prospection">
          <option value="first">1. Premier message</option>

      </select>

      <select id="filter" aria-label="Filtre">
        <option value="todo">Seulement les concernés</option>
        <option value="all">Tous</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
  </header>

        </div>
      </details>
      <p class="hint">Tout est enregistré dans ce navigateur uniquement. Chaque message contient « STOP » pour se désinscrire : respecte toujours un refus.</p>

      { id: 285, name: "Ayyildiz Coiffure", job: 'coiffure', phone: '0610992548', city: "Saint-Fons", status: 'new' },
      { id: 286, name: "Urban Hair by Myriam", job: 'coiffure', phone: '0663772604', city: "Saint-Fons", status: 'new' },
      { id: 287, name: "X Men Coiffure", job: 'coiffure', phone: '0614496303', city: "Saint-Fons", status: 'new' },
      { id: 288, name: "SARL Evolution (coiffure)", job: 'coiffure', phone: '0758257137', city: "Saint-Fons", status: 'new' },
      { id: 289, name: "Estelle Naquin (coiffure)", job: 'coiffure', phone: '0777372373', city: "Saint-Fons", status: 'new' },
      { id: 290, name: "Socc Hair", job: 'coiffure', phone: '0677122089', city: "Saint-Priest", status: 'new' },
      { id: 291, name: "AM Beauty Hair", job: 'coiffure', phone: '0629363940', city: "Oullins", status: 'new' },
      { id: 292, name: "Vittoria Spirit Hair", job: 'coiffure', phone: '0628273991', city: "Oullins", status: 'new' },
      { id: 293, name: "C Créatif Céline", job: 'coiffure', phone: '0668039380', city: "Grigny", status: 'new' },
      { id: 294, name: "Evolu Tiff Création", job: 'coiffure', phone: '0603707486', city: "Grigny", status: 'new' },
      { id: 295, name: "Danaë Castillo (coiffure)", job: 'coiffure', phone: '0624180712', city: "Grigny", status: 'new' },
      { id: 296, name: "Fabienne Damerose (coiffure)", job: 'coiffure', phone: '0777283028', city: "Grigny", status: 'new' },
      { id: 297, name: "Agnès Bougnot (coiffure)", job: 'coiffure', phone: '0611753918', city: "Grigny", status: 'new' },
      { id: 298, name: "Jenny F Hair", job: 'coiffure', phone: '0650026034', city: "Brignais", status: 'new' },
      { id: 299, name: "Véronique Renard (coiffure)", job: 'coiffure', phone: '0625338191', city: "Brignais", status: 'new' },
    ];
    const STATUS = { new: 'À contacter', envoye: 'Message envoyé', relance: 'Relancé', interesse: 'Intéressé', client: 'Client ✓', refus: 'Pas intéressé', stop: 'STOP — ne plus contacter' };
    let db;
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!db) db = { me: '', prospects: seed };
    // merge newly added seed prospects into an existing saved list
    seed.forEach((sp) => { if (!db.prospects.some((x) => x.id === sp.id)) db.prospects.push(sp); });
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
    const $ = (s) => document.querySelector(s);
    $('#me').value = db.me || '';
    $('#me').oninput = (e) => { db.me = e.target.value.trim(); save(); render(); };
    $('#tpl').onchange = render; $('#filter').onchange = render;

    const isMobileNumber = (p) => /^0[67]/.test(p.replace(/\D/g, ''));
    const intl = (p) => { const d = p.replace(/\D/g, ''); return d.startsWith('0') ? '33' + d.slice(1) : d; };
    const PAY = 'https://buy.stripe.com/6oU7sKeFweKm5UU84z7Zu04';
    const MAINT = 'https://buy.stripe.com/9B63cucxo0Tw5UU5Wr7Zu05';
    const STOP = '\nSTOP pour ne plus être contacté';
    // statut appliqué automatiquement après l'envoi de chaque modèle
    const NEXT = { first: 'envoye', relance: 'relance', infos: 'interesse', maquette: 'interesse', paye: 'client' };
    const msg = (p) => {
      const me = db.me || '[ton prénom]';
      const link = SITE + DEMO[p.job];
      const mock = p.mockup || '[lien de sa maquette]';
      switch ($('#tpl').value) {
        case 'relance':
          return `Bonjour, c'est ${me} de Vortex. Avez-vous pu regarder l'exemple de site que je vous ai envoyé ? Je peux vous préparer gratuitement une maquette avec le nom « ${p.name} » et vos photos, sans engagement. Bonne journée !${STOP}`;
        case 'infos':
          return `Merci pour votre retour ! Pour que vous voyiez concrètement, je vous prépare gratuitement une maquette de votre site, avec votre nom. Vous ne payez rien si elle ne vous plaît pas.\nIl me faut juste :\n1. vos services principaux\n2. votre zone d'intervention\n3. 3 ou 4 photos (chantiers, boutique…) et votre logo si vous en avez un\nVous pouvez me les envoyer ici directement 👍`;
        case 'maquette':
          return `Voici la maquette de votre site 👉 ${mock}\nRegardez tranquillement sur votre téléphone. Si vous voulez des changements (textes, couleurs, photos), dites-le-moi et je les fais.\nSi elle vous plaît, on la met en ligne pour 250 € tout compris, paiement sécurisé par carte ici 👉 ${PAY}`;
        case 'paye':
          return `Merci, paiement bien reçu ✅ Je m'occupe de la mise en ligne de votre site et je vous tiens au courant.\nPour que votre site reste à jour et sécurisé, et que je fasse vos modifications (horaires, tarifs, photos), il existe une formule à 50 €/mois sans engagement 👉 ${MAINT}`;
        case 'o-cher':
          return `Je comprends ! C'est 250 € une seule fois, sans abonnement obligatoire. Un seul nouveau client trouvé grâce au site le rembourse. Et je vous montre la maquette avant tout paiement 🙂`;
        case 'o-facebook':
          return `Facebook, c'est bien pour vos habitués, mais il remonte très peu sur Google. Quand quelqu'un cherche « ${LABEL[p.job] === 'votre métier' ? 'artisan' : LABEL[p.job].replace(/^un |^une /, '')} ${p.city} », ce sont les sites qui apparaissent. Les deux se complètent très bien !`;
        case 'o-temps':
          return `Justement, vous n'avez rien à faire : envoyez-moi 3 photos et vos services, je m'occupe de tout le reste. Ça vous prend 5 minutes 👍`;
        case 'o-reflechir':
          return `Aucun souci, prenez votre temps ! Je peux quand même vous préparer la maquette gratuitement, comme ça vous décidez en voyant votre futur site. Ça vous va ?`;
        default:
          return `Bonjour, je suis ${me}, je crée des sites web pour les pros de ${p.city}. J'ai vu que ${p.name} n'avait pas encore de site : voici un exemple de ce que ça pourrait donner pour ${LABEL[p.job]} 👉 ${link}\nSite clé en main à 250 €, visible sur Google. Intéressé(e) ?${STOP}`;
      }
    };

    function render() {
      const list = $('#list'); list.innerHTML = '';
      const todo = $('#filter').value === 'todo';
      const counts = {}; db.prospects.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });
      $('#stats').innerHTML = `<span><b>${db.prospects.length}</b> prospects</span><span><b>${(counts.envoye || 0) + (counts.relance || 0)}</b> contactés</span><span><b>${(counts.interesse || 0) + (counts.client || 0)}</b> intéressés</span>`;
      db.prospects
        .filter((p) => {
          if (!todo) return true;
          const t = $('#tpl').value;
          if (t === 'first') return p.status === 'new';
          if (t === 'relance') return p.status === 'envoye';
          if (t === 'paye') return p.status === 'interesse';
          if (['infos', 'maquette'].includes(t) || t.startsWith('o-')) return ['envoye', 'relance', 'interesse'].includes(p.status);
          return true;
        })
        .forEach((p) => {
          const card = document.createElement('div');
          card.className = 'card' + (['refus', 'stop', 'client'].includes(p.status) ? ' done' : '');
          const text = msg(p);
          const smsHref = `sms:${p.phone.replace(/\s/g, '')}?&body=${encodeURIComponent(text)}`;
          const waHref = `https://wa.me/${intl(p.phone)}?text=${encodeURIComponent(text)}`;
          const blocked = p.status === 'stop' || (p.status === 'refus' && ['first', 'relance'].includes($('#tpl').value));
          card.innerHTML = `
            <div class="top"><div><div class="name"></div><div class="meta"></div></div><span class="pill s-${p.status}">${STATUS[p.status]}</span></div>
            ${$('#tpl').value === 'maquette' ? '<input class="mock" placeholder="Colle ici le lien de sa maquette" aria-label="Lien de la maquette" style="width:100%;margin-top:12px">' : ''}
            <textarea aria-label="Message"></textarea>
            <div class="btns">
              <a class="btn primary" data-act="sms" href="${smsHref}" ${blocked ? 'aria-disabled="true"' : ''}>💬 Envoyer le SMS</a>
              <a class="btn wa" data-act="wa" href="${waHref}" target="_blank" rel="noopener" ${blocked || !isMobileNumber(p.phone) ? 'aria-disabled="true"' : ''}>WhatsApp</a>
              <a class="btn" href="tel:${p.phone.replace(/\s/g, '')}">📞 Appeler</a>
              <select aria-label="Statut">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === p.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
              <button class="btn small" data-act="del" type="button" title="Supprimer">🗑</button>
            </div>
            ${isMobileNumber(p.phone) ? '' : '<p class="hint">Numéro fixe : le SMS n\'arrivera probablement pas, préfère l\'appel.</p>'}`;
          card.querySelector('.name').textContent = p.name;
          card.querySelector('.meta').textContent = `${p.city} · ${p.phone}`;
          const ta = card.querySelector('textarea'); ta.value = text;
          const mk = card.querySelector('.mock');
          if (mk) { mk.value = p.mockup || ''; mk.onchange = () => { p.mockup = mk.value.trim(); save(); render(); }; }
          ta.oninput = () => {
            card.querySelector('[data-act=sms]').href = `sms:${p.phone.replace(/\s/g, '')}?&body=${encodeURIComponent(ta.value)}`;
            card.querySelector('[data-act=wa]').href = `https://wa.me/${intl(p.phone)}?text=${encodeURIComponent(ta.value)}`;
          };
          const mark = () => { const n = NEXT[$('#tpl').value]; if (n) p.status = n; p.date = new Date().toLocaleDateString('fr-FR'); save(); setTimeout(render, 400); };
          card.querySelector('[data-act=sms]').addEventListener('click', mark);
          card.querySelector('[data-act=wa]').addEventListener('click', mark);
          card.querySelector('select').onchange = (e) => { p.status = e.target.value; save(); render(); };
          card.querySelector('[data-act=del]').onclick = () => { if (confirm('Supprimer ce prospect ?')) { db.prospects = db.prospects.filter((x) => x !== p); save(); render(); } };
          list.appendChild(card);
        });
      if (!list.children.length) list.innerHTML = '<div class="card">Personne dans cette étape pour l\'instant. Choisis « Tous » dans le filtre pour voir toute ta liste.</div>';
    }

    $('#a-add').onclick = () => {
      const name = $('#a-name').value.trim(), phone = $('#a-phone').value.trim();
      if (!name || !phone) { alert('Nom et téléphone obligatoires.'); return; }
      db.prospects.unshift({ id: Date.now(), name, phone: phone.replace(/\s/g, ''), job: $('#a-job').value, city: $('#a-city').value.trim() || 'Lyon', status: 'new' });
      $('#a-name').value = ''; $('#a-phone').value = ''; save(); render();
    };
    render();
  })();
  </script>
</body>
</html>
