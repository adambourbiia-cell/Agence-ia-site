<div class="cam">
  <div class="left">
    <div class="pill eb"><span class="dot"></span>Résultat</div>
    <div class="disp big"><span class="w w1">Vos</span> <span class="vis"><span class="w w2">visiteurs</span><i class="strike"></i></span></div>
    <div class="disp big"><span class="w w3">deviennent</span></div>
    <div class="disp big"><span class="w w4">des</span> <span class="w w5 acc">clients.</span></div>
  </div>
  <div class="feed"><div class="list"></div></div>
</div>

<style>
.left { position: absolute; left: 140px; top: 330px; width: 900px; }
.eb { margin-bottom: 30px; }
.big { font-size: 94px; line-height: 1.12; white-space: nowrap; }
.w { display: inline-block; }
.vis { position: relative; display: inline-block; }
.strike { position: absolute; left: -6px; right: -6px; top: 54%; height: 10px; border-radius: 5px; background: var(--acc); transform-origin: 0 50%; display: block; }
.feed { position: absolute; left: 1150px; top: 90px; width: 680px; height: 900px; overflow: hidden;
  -webkit-mask: linear-gradient(180deg, transparent 0, #000 60px, #000 760px, transparent 900px);
  mask: linear-gradient(180deg, transparent 0, #000 60px, #000 760px, transparent 900px); }
.list { position: absolute; left: 20px; right: 20px; top: 70px; }
.note { position: absolute; left: 0; right: 0; top: 0; height: 118px; display: flex; align-items: center; gap: 22px; padding: 0 26px; border-radius: 24px; background: linear-gradient(180deg, #1a1f2a, #141821); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.4); transform-origin: 50% 0; }
.note .ic { width: 64px; height: 64px; border-radius: 18px; background: rgba(34,193,211,0.12); display: flex; align-items: center; justify-content: center; flex: none; }
.note .ic svg { width: 32px; height: 32px; }
.note .tx { flex: 1; min-width: 0; }
.note b { display: block; font-size: 27px; font-weight: 700; color: #fff; white-space: nowrap; }
.note span { display: block; font-size: 21px; color: var(--mute); margin-top: 4px; white-space: nowrap; }
.note em { font-style: normal; font-size: 18px; color: var(--dim); align-self: flex-start; margin-top: 26px; }
</style>

<script>
const cam = q(".cam");
const eb = q(".eb");
const W = qa(".w");
const strike = q(".strike");
const list = q(".list");
const I = {
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  msg: '<path d="M4 5h16v11H8l-4 4z"/>',
  pin: '<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};
const N = [
  ["doc", "Nouvelle demande de devis", "via votre site"],
  ["phone", "Appel entrant", "depuis Google"],
  ["cal", "Rendez-vous réservé", "Mardi · 10 h 30"],
  ["msg", "Nouveau message", "Formulaire de contact"],
  ["pin", "Demande d'itinéraire", "depuis Google Maps"],
  ["cal", "Réservation en ligne", "Samedi · 20 h"],
  ["phone", "Demande de rappel", "via votre site"],
  ["user", "Nouveau client", "Premier rendez-vous"],
  ["check", "Devis accepté", "via votre site"],
  ["phone", "Appel entrant", "depuis votre fiche Google"],
  ["cal", "Rendez-vous réservé", "Jeudi · 15 h"],
];
const T_START = A(19.62), GAP = 0.3, ROW = 136;
const notes = N.map(([ic, b, s], i) => {
  const el = document.createElement("div");
  el.className = "note";
  el.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#22c1d3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[ic]}</svg></div><div class="tx"><b>${b}</b><span>${s}</span></div><em>maintenant</em>`;
  list.appendChild(el);
  return { el, t0: T_START + i * GAP };
});
const WT = [20.7, 20.84, 21.26, 21.74, 21.88].map(A);

function render(t) {
  const ta = t + T0;
  const pe = VX.sp(ta, 19.66, 2.6, 0.8);
  VX.tf(eb, `translate3d(${((1 - pe) * -40).toFixed(1)}px, 0, 0)`);
  VX.op(eb, VX.clamp(pe * 1.5));
  W.forEach((w, i) => {
    const p = VX.sp(t, WT[i], 2.7, 0.78);
    VX.tf(w, `translate3d(0, ${((1 - p) * 90).toFixed(1)}px, 0)`);
    w.style.clipPath = `inset(-30% -5% ${((1 - VX.clamp(p)) * 100).toFixed(1)}% -5%)`;
    VX.op(w, t < WT[i] ? 0 : 1);
  });
  // "visiteurs" gets struck through and dims
  const ps = VX.E.inOutCubic(VX.prog(ta, 21.3, 21.62));
  VX.tf(strike, `scaleX(${ps.toFixed(4)})`);
  W[1].style.color = `rgba(255,255,255,${(1 - 0.62 * ps).toFixed(3)})`;
  // "clients." pops slightly
  const pc = VX.sp(ta, 21.88, 3, 0.5);
  W[4].style.transform += ` scale(${(1 + 0.06 * Math.max(0, pc - 1) * 4).toFixed(4)})`;

  // animated list: newest on top; each arrival pushes the stack down with a spring
  notes.forEach((n, i) => {
    const pin = VX.sp(t, n.t0, 2.7, 0.7);
    // slots below: number of later notes that have arrived (spring-weighted)
    let slot = 0;
    for (let k = i + 1; k < notes.length; k++) slot += VX.sp(t, notes[k].t0, 3.4, 0.82);
    const y = slot * ROW;
    VX.tf(n.el, `translate3d(0, ${(y - (1 - VX.clamp(pin)) * 50).toFixed(1)}px, 0) scale(${(0.6 + 0.4 * VX.clamp(pin, 0, 1.06)).toFixed(4)})`);
    VX.op(n.el, VX.clamp(pin * 2) * VX.clamp(1 - (slot - 4.2) / 1.2));
  });

  // camera: enter by push-out from the previous zoom, exit whip left
  const win = VX.E.outExpo(VX.prog(t, 0, 0.42));
  const wout = VX.E.inExpo(VX.prog(ta, 22.86, 23.143));
  VX.tf(cam, `translate3d(${(-wout * 2400).toFixed(1)}px, ${(-t * 5).toFixed(1)}px, 0) scale(${(0.7 + 0.3 * win + t * 0.01).toFixed(4)}) skewX(${(wout * 8).toFixed(2)}deg)`);
  const bl = Math.max((1 - win) * 12, wout * 14);
  cam.style.filter = bl > 0.3 ? `blur(${bl.toFixed(1)}px)` : "none";
  VX.op(cam, win);
}
VX.ready().then(() => {
  const tl = gsap.timeline({ paused: true });
  VX.clock(tl, DUR, render);
  window.__timelines[ID] = tl;
});
</script>
