// Shared, deterministic motion helpers. Inlined into every scene by tools/build.mjs.
// Everything is a pure function of scene time t (seconds) — no clocks, no randomness.
window.VX = window.VX || (function () {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, t0, t1) => (t1 <= t0 ? (t >= t1 ? 1 : 0) : clamp((t - t0) / (t1 - t0)));
  const E = {
    lin: (p) => p,
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    inCubic: (p) => p * p * p,
    inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outQuart: (p) => 1 - Math.pow(1 - p, 4),
    outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    inOutExpo: (p) =>
      p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
    inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  const tw = (t, t0, t1, a, b, ease = E.outCubic) => lerp(a, b, ease(prog(t, t0, t1)));

  // Closed-form step response of a damped spring (unit step at tau = 0).
  function step(tau, f, z) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (z >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + ((z * w) / wd) * Math.sin(wd * tau));
  }
  // Spring through a list of target changes: keys = [[t0, v0], [t1, v1], ...].
  // Value = v0 + sum of (vi - v(i-1)) * step(t - ti): one step response per target change.
  function spring(t, keys, f = 2.4, z = 0.74) {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * step(t - keys[i][0], f, z);

    for (const k in css) {

      else el.style[k] = css[k];
    }

  const tf = (el, s) => el && (el.style.transform = s);
  const op = (el, v) => el && (el.style.opacity = String(clamp(v)));

  // Split an element's words into mask-reveal structures: <span.mw><span.mwi>word</span></span>
  function splitWords(el) {
    const parts = [];
    const walk = (node, cls) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          child.textContent.split(/(\s+)/).forEach((w) => {
            if (!w) return;
            if (/^\s+$/.test(w)) parts.push({ space: true });
            else parts.push({ w, cls });

    parts.forEach((p) => {
      if (p.space) {

        return;
      }
      const mw = document.createElement("span");
      mw.className = "mw";
      const mwi = document.createElement("span");
      mwi.className = "mwi" + (p.cls ? " " + p.cls : "");
      mwi.textContent = p.w;
      mw.appendChild(mwi);
      el.appendChild(mw);
      words.push(mwi);
    });

      const lay = document.createElement("span");
      lay.className = "rot-layer";
      const letters = Array.from(w).map((ch) => {
        const m = document.createElement("span");
        m.className = "rot-m";
        const l = document.createElement("span");
        l.className = "rot-l";
        l.textContent = ch === " " ? " " : ch;
        m.appendChild(l);
        lay.appendChild(m);

        [arc, (q) => { const a = -Math.PI / 2 + (q / arc) * (Math.PI / 2); return [W - r + r * Math.cos(a), r + r * Math.sin(a)]; }],
        [sy, (q) => [W, r + q]],
        [arc, (q) => { const a = (q / arc) * (Math.PI / 2); return [W - r + r * Math.cos(a), H - r + r * Math.sin(a)]; }],
        [sx, (q) => [W - r - q, H]],
        [arc, (q) => { const a = Math.PI / 2 + (q / arc) * (Math.PI / 2); return [r + r * Math.cos(a), H - r + r * Math.sin(a)]; }],
        [sy, (q) => [0, H - r - q]],
        [arc, (q) => { const a = Math.PI + (q / arc) * (Math.PI / 2); return [r + r * Math.cos(a), r + r * Math.sin(a)]; }],
      ];
      for (const [len, f] of segs) {
        if (d <= len) return f(d);
        d -= len;
      }
      return [r, 0];
    }
    function render(t, speed = 0.42, phase = 0, alpha = 1) {
      if (!W) measure();
      const [x, y] = point(t * speed + phase);
      dot.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
      ring.style.opacity = String(alpha);
    }
    return { render, measure, ring };
  }

  // Layout-independent text width (canvas) — works even while the slot is hidden.
  const _cv = document.createElement("canvas").getContext("2d");
  function textW(text, el) {
    const cs = getComputedStyle(el);
    _cv.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    return _cv.measureText(text).width + ls * Array.from(text).length;
  }

  // Deterministic looping offset (marquee).
  const loop = (t, speed, len) => (((t * speed) % len) + len) % len;

  // Render clock: a property setter tweened by the paused GSAP timeline calls render(t)
  // on every seek, so the whole scene state is a pure function of time.
  function clock(tl, dur, render) {
    let cur = -1;
    const proxy = {};
    Object.defineProperty(proxy, "t", {
      get: () => cur,
      set: (v) => {
        cur = v;
        render(v);
      },
    });
    tl.fromTo(proxy, { t: 0 }, { t: dur, duration: dur, ease: "none" }, 0);
    render(0);
    return tl;
  }

  async function ready(fonts) {
    try {
      await Promise.all(
        (fonts || ['800 100px "Syne"', '700 100px "Syne"', '400 40px "Inter"', '600 40px "Inter"']).map((f) => document.fonts.load(f)),
      );
      await document.fonts.ready;
    } catch (e) {}
  }

  return { textW, clamp, lerp, prog, E, tw, step, spring, sp, rng, set, tf, op, splitWords, revealWords, hideWords, rotator, beam, loop, clock, ready };
})();

(function () {
  const ID = "s07";
  const DUR = 5.429;
  const T0 = 28;
  const A = (x) => x - T0; // absolute (voice-over) time -> scene time
  const root = document.querySelector('[data-composition-id="s07"]');
  const q = (sel) => root.querySelector(sel);
  const qa = (sel) => Array.from(root.querySelectorAll(sel));

const cam = q(".cam");
const cells = qa(".cell");
const scroller = q(".scroller");
const rank = q(".rank");
const checks = qa(".ck svg path");
const ckRows = qa(".ck");
const barEls = qa(".bars i");
const veil = q(".veil");
const final = q(".final");
const gpin = q(".gpin");
["brasier", "cuivre", "lune", "delta", "brasier", "cuivre"].forEach((n) => {
  const im = document.createElement("img");
  im.src = "assets/img/" + n + ".jpg";
  scroller.appendChild(im);
});
const spots = cells.map((c) => {
  const s = document.createElement("div");
  s.className = "spot";
  c.appendChild(s);
  return s;
});
const cbeams = cells.map((c) => VX.beam(c, { radius: 26, size: 280 }));
// ranking rows: index 4 = "Votre entreprise", climbs to the top
const rows = [];
for (let i = 0; i < 5; i++) {
  const r = document.createElement("div");
  r.className = "rk" + (i === 4 ? " me" : "");
  r.innerHTML = i === 4 ? '<i class="f"></i><b>Votre entreprise</b><span>votre-entreprise.fr</span>' : `<i class="f"></i><i style="width:${[52, 40, 60, 46][i]}%"></i>`;
  rank.appendChild(r);
  rows.push(r);
}
const CLIMB = A(29.3);
checks.forEach((p) => { p.style.strokeDasharray = "24"; });
const BH = [0.38, 0.46, 0.44, 0.58, 0.64, 0.72, 0.86];
const fw = VX.splitWords(final);
const FT = [31.48, 31.52, 31.98, 32.14].map(A);

// camera targets (absolute times): centre x, centre y, scale
const CAM = [
  [28.0, 540, 1015, 1.0],
  [28.36, 540, 385, 1.22],
  [29.02, 540, 890, 1.22],
  [29.88, 540, 1305, 1.3],
  [30.5, 540, 1680, 1.22],
  [31.42, 540, 1015, 0.94],
];
const ck = (k) => CAM.map((c) => [A(c[0]), c[k]]);
const KX = ck(1), KY = ck(2), KS = ck(3);

function render(t) {
  const ta = t + T0;
  // cells fly in from different directions
  const FROM = [[-900, -200, -12], [900, -100, 12], [-900, 200, 10], [900, 400, -10]];
  cells.forEach((c, i) => {
    const p = VX.sp(t, 0.02 + i * 0.07, 2.2, 0.76);
    const [fx, fy, fr] = FROM[i];
    VX.tf(c, `translate3d(${((1 - p) * fx).toFixed(1)}px, ${((1 - p) * fy).toFixed(1)}px, 0) rotate(${((1 - p) * fr).toFixed(2)}deg) scale(${(0.8 + 0.2 * VX.clamp(p, 0, 1.05)).toFixed(4)})`);
    VX.op(c, VX.clamp(p * 1.6));
    spots[i].style.setProperty("--sx", (300 + Math.sin(t * 1.4 + i * 2) * 260).toFixed(0) + "px");
    spots[i].style.setProperty("--sy", (160 + Math.cos(t * 1.1 + i) * 120).toFixed(0) + "px");
  });
  // focus beam on the cell the camera dives into
  const focus = [[A(28.36), A(29.02)], [A(29.02), A(29.88)], [A(29.88), A(30.5)], [A(30.5), A(31.42)]];
  cbeams.forEach((b, i) => {
    const [a, z] = focus[i];
    b.render(t, 0.5, i * 0.2, VX.tw(t, a, a + 0.2, 0, 1) * (1 - VX.tw(t, z, z + 0.2, 0, 1)));
  });

  // A: website scrolls continuously
  VX.tf(scroller, `translate3d(0, ${(-VX.loop(t, 260, 4 * 565)).toFixed(1)}px, 0)`);
  // B: "Votre entreprise" climbs from 5th to 1st
  rows.forEach((r, i) => {
    let slot;
    if (i === 4) slot = VX.spring(t, [[0, 4], [CLIMB, 3], [CLIMB + 0.18, 2], [CLIMB + 0.36, 1], [CLIMB + 0.54, 0]], 3, 0.8);
    else slot = i + VX.sp(t, CLIMB + (3 - i) * 0.18, 3, 0.8);
    VX.tf(r, `translate3d(0, ${(slot * 62).toFixed(1)}px, 0)`);
  });
  // C: pin bounce
  const pp = VX.sp(t, A(29.95), 2.8, 0.55);
  VX.tf(gpin, `translate3d(0, ${((1 - pp) * -60).toFixed(1)}px, 0)`);
  // D: checks draw, bars grow
  checks.forEach((p, i) => {
    p.style.strokeDashoffset = (24 * (1 - VX.E.outCubic(VX.prog(ta, 30.62 + i * 0.16, 30.9 + i * 0.16)))).toFixed(2);
    VX.op(ckRows[i], VX.tw(ta, 30.55 + i * 0.16, 30.75 + i * 0.16, 0.35, 1));
  });
  barEls.forEach((b, i) => {
    const p = VX.sp(ta, 30.7 + i * 0.07, 2.6, 0.7);
    VX.tf(b, `scaleY(${(BH[i] * Math.max(0, p)).toFixed(4)})`);
  });

  // camera dives into each cell as the voice names it, then pulls back
  const s = VX.spring(t, KS, 1.9, 0.86), cx = VX.spring(t, KX, 1.9, 0.86), cy = VX.spring(t, KY, 1.9, 0.86);
  const wout = VX.E.inCubic(VX.prog(ta, 33.143, 33.429));
  const S = s * (1 - 0.15 * wout);
  VX.tf(cam, `translate3d(${(540 - cx * S).toFixed(1)}px, ${(960 - cy * S).toFixed(1)}px, 0) scale(${S.toFixed(4)})`);
  cam.style.filter = wout > 0.02 ? `blur(${(wout * 10).toFixed(1)}px)` : "none";
  VX.op(cam, 1 - wout);

  // "On s'occupe de tout."
  VX.op(veil, VX.tw(ta, 31.4, 31.8, 0, 1));
  VX.revealWords(fw, t, FT);
}
VX.ready().then(() => {
  const tl = gsap.timeline({ paused: true });
  VX.clock(tl, DUR, render);
  window.__timelines[ID] = tl;
});

})();
      </script>
    </template>
  </body>
</html>
