// Shared, deterministic motion helpers. Inlined into every scene by tools/build.mjs.
// Everything is a pure function of scene time t (seconds) — no clocks, no randomness.
window.VX = window.VX || (function () {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, t0, t1) => (t1 <= t0 ? (t >= t1 ? 1 : 0) : clamp((t - t0) / (t1 - t0)));
  const E = {
    lin: (p) => p,
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    inCubic: (p) => p * p * p,
    inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outQuart: (p) => 1 - Math.pow(1 - p, 4),
    outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    inOutExpo: (p) =>
      p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
    inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  const tw = (t, t0, t1, a, b, ease = E.outCubic) => lerp(a, b, ease(prog(t, t0, t1)));

  // Closed-form step response of a damped spring (unit step at tau = 0).
  function step(tau, f, z) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (z >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + ((z * w) / wd) * Math.sin(wd * tau));
  }
  // Spring through a list of target changes: keys = [[t0, v0], [t1, v1], ...].
  // Value = v0 + sum of (vi - v(i-1)) * step(t - ti): one step response per target change.
  function spring(t, keys, f = 2.4, z = 0.74) {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * step(t - keys[i][0], f, z);

      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;

    for (const k in css) {

  const tf = (el, s) => el && (el.style.transform = s);
  const op = (el, v) => el && (el.style.opacity = String(clamp(v)));

  // Split an element's words into mask-reveal structures: <span.mw><span.mwi>word</span></span>
  function splitWords(el) {
    const parts = [];
    const walk = (node, cls) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {

    parts.forEach((p) => {
      if (p.space) {

      mw.className = "mw";
      const mwi = document.createElement("span");

      layers.forEach((L, i) => {
        const tin = times[i];
        const tout = i + 1 < times.length ? times[i + 1] : 1e9;
        L.letters.forEach((l, k) => {
          const pin = tin < 0 ? 1 : E.outCubic(prog(t, tin + k * stg, tin + k * stg + d));
          const pout = E.inCubic(prog(t, tout + k * stg, tout + k * stg + d * 0.8));
          const y = (1 - pin) * 105 - pout * 105;
          l.style.transform = `translate3d(0, ${y}%, 0)`;
          l.style.opacity = pin > 0 && pout < 1 ? "1" : "0";
        });
      });
      // width follows the current word with a spring
      const keys = [[0, layers[0].width]];
      for (let i = 1; i < times.length; i++) keys.push([times[i], layers[i].width]);
      el.style.width = spring(t, keys, 2.8, 0.8).toFixed(2) + "px";
      return cur;
    }
    return { measure, render, layers };
  }

  // Border Beam: a light blob travelling around a rounded rect, masked to the border ring.
  function beam(host, opts = {}) {
    const ring = document.createElement("div");
    ring.className = "beam";
    ring.setAttribute("data-layout-allow-overflow", "");
    if (opts.radius != null) ring.style.borderRadius = opts.radius + "px";
    const dot = document.createElement("div");
    dot.className = "beam-dot";
    if (opts.size) set(dot, { width: opts.size + "px", height: opts.size + "px", margin: `${-opts.size / 2}px 0 0 ${-opts.size / 2}px` });
    ring.appendChild(dot);
    host.appendChild(ring);
    let W = 0, H = 0;
    const R = opts.radius ?? 20;
    const measure = () => {
      W = host.offsetWidth;
      H = host.offsetHeight;
    };
    function point(u) {
      // u in [0,1) along a rounded-rect perimeter, clockwise from top-left straight segment
      const r = Math.min(R, W / 2, H / 2);
      const sx = W - 2 * r, sy = H - 2 * r, arc = (Math.PI * r) / 2;
      const P = 2 * sx + 2 * sy + 4 * arc;
      let d = (((u % 1) + 1) % 1) * P;
      const segs = [
        [sx, (q) => [r + q, 0]],
        [arc, (q) => { const a = -Math.PI / 2 + (q / arc) * (Math.PI / 2); return [W - r + r * Math.cos(a), r + r * Math.sin(a)]; }],
        [sy, (q) => [W, r + q]],
        [arc, (q) => { const a = (q / arc) * (Math.PI / 2); return [W - r + r * Math.cos(a), H - r + r * Math.sin(a)]; }],
        [sx, (q) => [W - r - q, H]],
        [arc, (q) => { const a = Math.PI / 2 + (q / arc) * (Math.PI / 2); return [r + r * Math.cos(a), H - r + r * Math.sin(a)]; }],
        [sy, (q) => [0, H - r - q]],
        [arc, (q) => { const a = Math.PI + (q / arc) * (Math.PI / 2); return [r + r * Math.cos(a), r + r * Math.sin(a)]; }],
      ];
      for (const [len, f] of segs) {
        if (d <= len) return f(d);
        d -= len;
      }
      return [r, 0];
    }
    function render(t, speed = 0.42, phase = 0, alpha = 1) {
      if (!W) measure();
      const [x, y] = point(t * speed + phase);
      dot.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
      ring.style.opacity = String(alpha);
    }
    return { render, measure, ring };
  }

  // Layout-independent text width (canvas) — works even while the slot is hidden.
  const _cv = document.createElement("canvas").getContext("2d");
  function textW(text, el) {
    const cs = getComputedStyle(el);
    _cv.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    return _cv.measureText(text).width + ls * Array.from(text).length;
  }

  // Deterministic looping offset (marquee).
  const loop = (t, speed, len) => (((t * speed) % len) + len) % len;

  // Render clock: a property setter tweened by the paused GSAP timeline calls render(t)
  // on every seek, so the whole scene state is a pure function of time.
  function clock(tl, dur, render) {
    let cur = -1;
    const proxy = {};
    Object.defineProperty(proxy, "t", {
      get: () => cur,
      set: (v) => {
        cur = v;
        render(v);
      },
    });
    tl.fromTo(proxy, { t: 0 }, { t: dur, duration: dur, ease: "none" }, 0);
    render(0);
    return tl;
  }

  async function ready(fonts) {
    try {
      await Promise.all(
        (fonts || ['800 100px "Syne"', '700 100px "Syne"', '400 40px "Inter"', '600 40px "Inter"']).map((f) => document.fonts.load(f)),
      );
      await document.fonts.ready;
    } catch (e) {}
  }

  return { textW, clamp, lerp, prog, E, tw, step, spring, sp, rng, set, tf, op, splitWords, revealWords, hideWords, rotator, beam, loop, clock, ready };
})();

(function () {
  const ID = "s04";
  const DUR = 4.286;
  const T0 = 15.429;
  const A = (x) => x - T0; // absolute (voice-over) time -> scene time
  const root = document.querySelector('[data-composition-id="s04"]');
  const q = (sel) => root.querySelector(sel);
  const qa = (sel) => Array.from(root.querySelectorAll(sel));

const cam = q(".cam");
const title = q(".title");
const tw = q(".tw");
const rw = VX.rotator(q(".rw"), ["Google,", "Maps,", "partout."], { stagger: 0.03, dur: 0.3 });
const RT = [16.5, 17.38, 17.8].map(A);
const hub = q(".hub");
const hbeam = VX.beam(hub, { radius: 26, size: 220 });
const c1 = q(".c1"), c2 = q(".c2"), c3 = q(".c3");
const b1beam = VX.beam(c1, { radius: 22, size: 240 });
const b2beam = VX.beam(c2, { radius: 22, size: 240 });
const pin = q(".pin"), pulse = q(".pulse"), plabel = q(".plabel");
const hit = q(".res.hit");
const devs = qa(".dev");
const paths = qa(".bp"), lights = qa(".bl");
let LEN = null;
const BT = [16.3, 17.18, 17.7].map(A); // beam fire times
const sats = q(".sats");
const ICONS = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="#22c1d3" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="#b7bfcb" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="#b7bfcb" stroke-width="2"><rect x="7" y="2.5" width="10" height="19" rx="2"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="#22c1d3" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="#b7bfcb" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M12 4v16"/></svg>',
];
const SAT = [
  { r: 170, a: 0, s: 26 }, { r: 170, a: 120, s: 26 }, { r: 170, a: 240, s: 26 },
  { r: 250, a: 60, s: -16 }, { r: 250, a: 240, s: -16 },
].map((o, i) => {
  const el = document.createElement("div");
  el.className = "sat";
  el.innerHTML = ICONS[i];
  sats.appendChild(el);
  return { ...o, el };
});

function render(t) {
  const ta = t + T0;
  if (!LEN || !LEN[0]) LEN = paths.map((p) => p.getTotalLength());
  // title
  const pt = VX.sp(ta, 15.62, 2.6, 0.8);
  VX.tf(tw, `translate3d(0, ${((1 - pt) * 70).toFixed(1)}px, 0)`);
  tw.style.clipPath = `inset(-20% -5% ${((1 - VX.clamp(pt)) * 100).toFixed(1)}% -5%)`;
  if (t >= RT[0]) rw.render(t, RT);
  else rw.layers.forEach((L) => L.letters.forEach((l) => (l.style.opacity = "0")));
  if (t < RT[0]) q(".rw").style.width = "0px";

  // hub + orbits
  const ph = VX.sp(t, 0.1, 2.2, 0.72);
  VX.tf(hub, `scale(${(0.6 + 0.4 * ph).toFixed(4)})`);
  VX.op(hub, VX.clamp(ph * 1.6));
  hbeam.render(t, 0.5, 0, 1);
  const po = VX.sp(t, 0.2, 1.6, 0.8);
  VX.tf(q(".orbits"), `scale(${(0.5 + 0.5 * po).toFixed(4)}) rotate(${(t * 8).toFixed(2)}deg)`);
  VX.op(q(".orbits"), VX.clamp(po));
  SAT.forEach((s, i) => {
    const a = ((s.a + t * s.s) * Math.PI) / 180;
    const pi = VX.sp(t, 0.3 + i * 0.06, 2.4, 0.7);
    const r = s.r * po;
    VX.tf(s.el, `translate3d(${(Math.cos(a) * r).toFixed(1)}px, ${(Math.sin(a) * r).toFixed(1)}px, 0) scale(${VX.clamp(pi, 0, 1.3).toFixed(3)})`);
  });

  // beams: draw the path, then a light pulse travels to the card
  paths.forEach((p, i) => {
    const d = VX.E.outCubic(VX.prog(t, BT[i] - 0.15, BT[i] + 0.15));
    p.style.strokeDasharray = `${LEN[i]}`;
    p.style.strokeDashoffset = `${(LEN[i] * (1 - d)).toFixed(1)}`;
    const L = lights[i];
    const seg = 90;
    const u = VX.E.inOutCubic(VX.prog(t, BT[i], BT[i] + 0.32));
    L.style.strokeDasharray = `${seg} ${LEN[i] + seg}`;
    L.style.strokeDashoffset = `${(seg - u * (LEN[i] + seg)).toFixed(1)}`;
    L.style.opacity = t > BT[i] && u < 1 ? "1" : "0";
  });

  // cards pop when their beam lands
  [[c1, 0], [c2, 1], [c3, 2]].forEach(([c, i]) => {
    const p = VX.sp(t, BT[i] + 0.22, 2.5, 0.72);
    VX.tf(c, `translate3d(0, ${((1 - p) * 50).toFixed(1)}px, 0) scale(${(0.86 + 0.14 * p).toFixed(4)})`);
    VX.op(c, VX.clamp(p * 1.6));
  });
  b1beam.render(t, 0.45, 0.3, VX.tw(t, BT[0] + 0.3, BT[0] + 0.6, 0, 1));
  b2beam.render(t, 0.45, 0.6, VX.tw(t, BT[1] + 0.3, BT[1] + 0.6, 0, 1));
  const ph1 = VX.tw(t, BT[0] + 0.45, BT[0] + 0.8, 0, 1);
  hit.style.boxShadow = `0 0 ${(ph1 * 40).toFixed(1)}px rgba(34,193,211,${(ph1 * 0.35).toFixed(3)})`;
  // map pin drops, pulse
  const pp = VX.sp(t, BT[1] + 0.4, 2.8, 0.55);
  VX.tf(pin, `translate3d(0, ${((1 - pp) * -120).toFixed(1)}px, 0) scale(${(0.7 + 0.3 * VX.clamp(pp, 0, 1.2)).toFixed(3)})`);
  VX.op(pin, VX.clamp(pp * 3));
  const pu = VX.prog(t, BT[1] + 0.55, BT[1] + 1.35);
  VX.tf(pulse, `scale(${(0.3 + pu * 1.6).toFixed(3)})`);
  VX.op(pulse, pu > 0 && pu < 1 ? 1 - pu : 0);
  const pl = VX.sp(t, BT[1] + 0.6, 2.6, 0.8);
  VX.op(plabel, VX.clamp(pl * 1.5));
  // devices light up in turn
  devs.forEach((d, i) => {
    const on = VX.tw(t, BT[2] + 0.35 + i * 0.18, BT[2] + 0.55 + i * 0.18, 0, 1);
    d.style.color = on > 0.5 ? "#22c1d3" : "#8b94a3";
    VX.tf(d, `scale(${(1 + 0.12 * Math.sin(Math.PI * VX.clamp(on))).toFixed(3)})`);
  });

  // camera: enter from below, drift, push in on exit
  const win = VX.E.outExpo(VX.prog(t, 0, 0.4));
  const wout = VX.E.inExpo(VX.prog(ta, 19.42, 19.714));
  cam.style.transformOrigin = "540px 1010px";
  VX.tf(cam, `translate3d(${(Math.sin(t * 0.7) * 8).toFixed(1)}px, ${((1 - win) * 1300).toFixed(1)}px, 0) scale(${(1.04 - t * 0.008 + wout * 2.2).toFixed(4)})`);
  const bl = Math.max((1 - win) * 14, wout * 12);
  cam.style.filter = bl > 0.3 ? `blur(${bl.toFixed(1)}px)` : "none";
  VX.op(cam, 1 - wout * 0.9);
}
VX.ready().then(() => {
  const tl = gsap.timeline({ paused: true });
  VX.clock(tl, DUR, render);
  window.__timelines[ID] = tl;
});

})();
      </script>
    </template>
  </body>
</html>
