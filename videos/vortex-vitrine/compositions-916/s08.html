// Shared, deterministic motion helpers. Inlined into every scene by tools/build.mjs.
// Everything is a pure function of scene time t (seconds) — no clocks, no randomness.
window.VX = window.VX || (function () {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const prog = (t, t0, t1) => (t1 <= t0 ? (t >= t1 ? 1 : 0) : clamp((t - t0) / (t1 - t0)));
  const E = {
    lin: (p) => p,
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    inCubic: (p) => p * p * p,
    inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outQuart: (p) => 1 - Math.pow(1 - p, 4),
    outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
    inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
    inOutExpo: (p) =>
      p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
    inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  const tw = (t, t0, t1, a, b, ease = E.outCubic) => lerp(a, b, ease(prog(t, t0, t1)));

  // Closed-form step response of a damped spring (unit step at tau = 0).
  function step(tau, f, z) {
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (z >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + ((z * w) / wd) * Math.sin(wd * tau));
  }
  // Spring through a list of target changes: keys = [[t0, v0], [t1, v1], ...].
  // Value = v0 + sum of (vi - v(i-1)) * step(t - ti): one step response per target change.
  function spring(t, keys, f = 2.4, z = 0.74) {
    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * step(t - keys[i][0], f, z);

  function splitWords(el) {
    const parts = [];
    const walk = (node, cls) => {
      for (const child of Array.from(node.childNodes)) {

            if (!w) return;

    parts.forEach((p) => {

        return;
      }

      mw.className = "mw";
      const mwi = document.createElement("span");
      mwi.className = "mwi" + (p.cls ? " " + p.cls : "");
      mwi.textContent = p.w;
      mw.appendChild(mwi);
      el.appendChild(mw);
      words.push(mwi);

      const lay = document.createElement("span");
      lay.className = "rot-layer";
      const letters = Array.from(w).map((ch) => {
        const m = document.createElement("span");
        m.className = "rot-m";
        const l = document.createElement("span");
        l.className = "rot-l";
        l.textContent = ch === " " ? " " : ch;
        m.appendChild(l);
        lay.appendChild(m);

        [arc, (q) => { const a = Math.PI / 2 + (q / arc) * (Math.PI / 2); return [r + r * Math.cos(a), H - r + r * Math.sin(a)]; }],

      ring.style.opacity = String(alpha);
    }
    return { render, measure, ring };
  }

  // Layout-independent text width (canvas) — works even while the slot is hidden.
  const _cv = document.createElement("canvas").getContext("2d");
  function textW(text, el) {
    const cs = getComputedStyle(el);
    _cv.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0;
    return _cv.measureText(text).width + ls * Array.from(text).length;
  }

  // Deterministic looping offset (marquee).
  const loop = (t, speed, len) => (((t * speed) % len) + len) % len;

  // Render clock: a property setter tweened by the paused GSAP timeline calls render(t)
  // on every seek, so the whole scene state is a pure function of time.
  function clock(tl, dur, render) {
    let cur = -1;
    const proxy = {};
    Object.defineProperty(proxy, "t", {
      get: () => cur,
      set: (v) => {
        cur = v;
        render(v);
      },
    });
    tl.fromTo(proxy, { t: 0 }, { t: dur, duration: dur, ease: "none" }, 0);
    render(0);
    return tl;
  }

  async function ready(fonts) {
    try {
      await Promise.all(
        (fonts || ['800 100px "Syne"', '700 100px "Syne"', '400 40px "Inter"', '600 40px "Inter"']).map((f) => document.fonts.load(f)),
      );
      await document.fonts.ready;
    } catch (e) {}
  }

  return { textW, clamp, lerp, prog, E, tw, step, spring, sp, rng, set, tf, op, splitWords, revealWords, hideWords, rotator, beam, loop, clock, ready };
})();

(function () {
  const ID = "s08";
  const DUR = 8;
  const T0 = 33.143;
  const A = (x) => x - T0; // absolute (voice-over) time -> scene time
  const root = document.querySelector('[data-composition-id="s08"]');
  const q = (sel) => root.querySelector(sel);
  const qa = (sel) => Array.from(root.querySelectorAll(sel));

const cam = q(".cam");
const qEl = q(".q");
const tablet = q(".tablet");
const page = q(".page");
const sbtn = q(".sbtn");
const spark = q(".spark");
const sheen = q(".sheen");
const st = [q(".st1"), q(".st2"), q(".st3")];
const spin = q(".spin");
const okPath = q(".ok path");
const ctaPart = q(".ctaPart");
const cursor = q(".cursor");
const ring = q(".ring");
const mark = q(".end .mark");
const arcs = q(".end .arcs");
const nameEl = q(".name");
const base = q(".base");
const meta = q(".meta");
const band = q(".band");
const track = q(".track");
const qw = VX.splitWords(qEl);
const QT = [33.46, 33.65, 33.7, 33.91, 34.05].map(A);
const ITEMS = ["Artisans", "Restaurants", "Coiffeurs", "Garages", "Commerçants", "Lyon", "Villeurbanne", "Vénissieux", "Brignais"];
let html = "";
for (let k = 0; k < 3; k++) ITEMS.forEach((s) => (html += `<span>${s}</span><i></i>`));
track.innerHTML = html;
let trackW = 0;
const nameLetters = Array.from("vortex").map((ch) => {
  const s = document.createElement("span");
  s.style.display = "inline-block";
  s.textContent = ch;
  return s;
});
nameEl.textContent = "";
nameLetters.forEach((s) => nameEl.appendChild(s));
const CLICK = A(34.86), LOAD = A(34.98), DONE = A(35.62), END = A(36.571);
const CX = [[0, 1000], [A(34.2), 1000], [A(34.45), 640], [A(35.3), 640], [A(35.6), 1100]];
const CY = [[0, 2000], [A(34.2), 2000], [A(34.45), 1622], [A(35.3), 1622], [A(35.6), 2000]];

function render(t) {
  const ta = t + T0;
  if (!trackW) trackW = ITEMS.reduce((a, s) => a + VX.textW(s, track.querySelector("span")) + 68 + 8, 0);
  // question + tablet (container scroll)
  VX.revealWords(qw, t, QT);
  const rise = VX.sp(ta, 33.2, 1.6, 0.85);
  const pt = VX.E.outCubic(VX.prog(ta, 33.25, 34.3));
  VX.tf(tablet, `translate3d(0, ${((1 - rise) * 700).toFixed(1)}px, 0) rotateX(${(20 * (1 - pt)).toFixed(2)}deg) scale(${(1.05 - 0.05 * pt).toFixed(4)})`);
  // stays between the services and the work sections: no price on screen (single CTA)
  // page is cropped above the offer section: no price on screen
  const sy = 420 + VX.E.inOutSine(VX.prog(ta, 33.9, 36.6)) * 540;
  VX.tf(page, `translate3d(0, ${(-sy).toFixed(1)}px, 0)`);

  // shimmer button
  const pb = VX.sp(ta, 33.75, 2.4, 0.75);
  const press = VX.spring(t, [[0, 1], [CLICK - 0.04, 0.93], [CLICK + 0.1, 1]], 4, 0.6);
  VX.tf(sbtn, `translate3d(0, ${((1 - pb) * 80).toFixed(1)}px, 0) scale(${(press * (0.9 + 0.1 * VX.clamp(pb))).toFixed(4)})`);
  VX.op(sbtn, VX.clamp(pb * 1.5));
  VX.tf(spark, `rotate(${(t * 220).toFixed(1)}deg)`);
  const shp = VX.loop(t, 0.55, 1);
  VX.tf(sheen, `translate3d(${(-200 + shp * 1000).toFixed(1)}px, 0, 0) skewX(-18deg)`);
  // states: label -> loader -> confirmation
  const s1 = 1 - VX.tw(t, LOAD - 0.06, LOAD + 0.08, 0, 1);
  const s2 = VX.tw(t, LOAD, LOAD + 0.12, 0, 1) * (1 - VX.tw(t, DONE - 0.05, DONE + 0.08, 0, 1));
  const s3 = VX.tw(t, DONE, DONE + 0.14, 0, 1);
  [s1, s2, s3].forEach((v, i) => {
    VX.op(st[i], v);
    VX.tf(st[i], `translate3d(0, ${((1 - v) * (i === 0 ? -24 : 24)).toFixed(1)}px, 0)`);
  });
  VX.tf(spin, `rotate(${(t * 720).toFixed(1)}deg)`);
  okPath.style.strokeDashoffset = (24 * (1 - VX.E.outCubic(VX.prog(t, DONE + 0.05, DONE + 0.4)))).toFixed(2);

  // cursor
  const cx = VX.spring(t, CX, 2, 0.82), cy = VX.spring(t, CY, 2, 0.82);
  const pr = Math.max(1 - Math.abs(t - CLICK) / 0.1, 0);
  VX.tf(cursor, `translate3d(${cx.toFixed(1)}px, ${cy.toFixed(1)}px, 0) scale(${(1 - 0.16 * pr).toFixed(3)})`);
  VX.op(cursor, VX.tw(ta, 34.15, 34.3, 0, 1) * (1 - VX.prog(ta, 35.45, 35.6)));

  // hand-off to the end card on the downbeat (36.571)
  const out = VX.E.inCubic(VX.prog(t, END - 0.3, END + 0.05));
  VX.tf(ctaPart, `translate3d(0, ${(out * 60).toFixed(1)}px, 0) scale(${(1 - out * 0.25).toFixed(4)})`);
  VX.op(ctaPart, 1 - out);
  ctaPart.style.filter = out > 0.02 ? `blur(${(out * 12).toFixed(1)}px)` : "none";

  // end card: impact on the logo
  const pm = VX.sp(t, END, 2.2, 0.62);
  VX.tf(mark, `scale(${(VX.clamp(pm, 0, 1.2) * 1).toFixed(4)})`);
  VX.op(mark, t >= END ? 1 : 0);
  VX.tf(arcs, `rotate(${(-200 * (1 - VX.sp(t, END, 1.4, 0.8)) + (t - END) * 6).toFixed(2)}deg)`);
  const rp = VX.prog(t, END, END + 0.9);
  VX.tf(ring, `scale(${(0.6 + rp * 3.2).toFixed(3)})`);
  VX.op(ring, rp > 0 && rp < 1 ? (1 - rp) * 0.9 : 0);
  nameLetters.forEach((l, i) => {
    const p = VX.sp(t, END + 0.12 + i * 0.05, 2.8, 0.78);
    VX.tf(l, `translate3d(0, ${((1 - p) * 70).toFixed(1)}px, 0)`);
    VX.op(l, VX.clamp(p * 1.6));
  });
  [[base, A(36.95)], [meta, A(37.12)]].forEach(([el, t0]) => {
    const p = VX.sp(t, t0, 2.6, 0.8);
    VX.tf(el, `translate3d(0, ${((1 - p) * 40).toFixed(1)}px, 0)`);
    VX.op(el, VX.clamp(p * 1.5));
  });
  // marquee band
  const pbd = VX.sp(ta, 37.3, 2, 0.85);
  VX.op(band, VX.clamp(pbd));
  if (trackW) VX.tf(track, `translate3d(${(-VX.loop(t, 70, trackW)).toFixed(1)}px, 0, 0)`);

  // camera: whip in from the left (previous scale-out), slow push on the end card
  const win = VX.E.outExpo(VX.prog(t, 0, 0.45));
  cam.style.transformOrigin = "540px 900px";
  VX.tf(cam, `translate3d(${((1 - win) * -1600).toFixed(1)}px, 0, 0) scale(${(1 + Math.max(0, t - END) * 0.012).toFixed(4)}) skewX(${((1 - win) * 6).toFixed(2)}deg)`);
  cam.style.filter = win < 0.97 ? `blur(${((1 - win) * 14).toFixed(1)}px)` : "none";
}
VX.ready().then(() => {
  const tl = gsap.timeline({ paused: true });
  VX.clock(tl, DUR, render);
  window.__timelines[ID] = tl;
});

})();
      </script>
    </template>
  </body>
</html>
